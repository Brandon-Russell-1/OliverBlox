<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>OliverBlox</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#29a8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="stars"><span class="star-icon">⭐</span><span id="star-count">0</span><span class="coin-icon">🪙</span><span id="coin-count">0</span></div>
      <div id="quests"></div>
      <div id="race" hidden></div>
      <div id="guide" hidden><span id="guide-icon"></span><span id="guide-arrow"></span><span id="guide-dist"></span></div>
      <div id="bag" hidden></div>
      <div id="home-tools" hidden>
        <button id="wall-btn" aria-label="Change the wall colour">🎨</button>
        <button id="floor-btn" aria-label="Change the floor colour">🟫</button>
      </div>
      <div id="map-zoom"><button id="map-in" aria-label="Zoom the map in">➕</button><button id="map-out" aria-label="Zoom the map out">➖</button></div>
      <div id="shop" hidden></div>
      <div id="hearts"></div>
      <button id="bag-btn" class="chip" aria-label="Bag">🎒</button>
      <button id="emote-btn" class="chip" aria-label="Send an emoji">😀</button>
      <button id="friends-btn" class="chip" aria-label="Play together">👫</button>
      <button id="code-btn" class="chip" aria-label="Program Bolt">🧩</button>
      <button id="bolt-talk" class="chip" aria-label="Talk to Bolt">🤖💬</button>
      <button id="garage-btn" class="chip" aria-label="Vehicles">🚗</button>
      <button id="gear" aria-label="Grown-ups: hold for settings">⚙️</button>
      <div id="gear-hint" hidden>Grown-ups: press and hold for 2 seconds</div>
      <canvas id="map" aria-label="Map: tap to make it bigger"></canvas>
      <div id="garage" hidden></div>
      <div id="friends" hidden>
        <input id="room-code" maxlength="12" autocomplete="off" autocapitalize="off" placeholder="room name" />
        <button id="room-join">▶️</button>
        <span id="room-status"></span>
      </div>
      <div id="emotes" hidden></div>
      <div id="code" hidden>
        <div id="code-strip"></div>
        <div id="code-row">
          <span id="code-palette"></span>
          <button id="code-undo" aria-label="Undo">⌫</button>
          <button id="code-repeat" aria-label="Repeat"></button>
          <button id="code-goal" aria-label="Puzzle">🎯</button>
          <button id="code-run" aria-label="Run">▶️</button>
          <button id="code-close" aria-label="Close">✖</button>
        </div>
      </div>
      <div id="bubble" hidden></div>

      <div id="hotbar"></div>

      <div id="joystick"><div id="knob"></div></div>
      <button id="action" class="round" hidden>🚗</button>
      <button id="fly" class="round small" aria-label="Fly">🦸</button>
      <button id="crawl" class="round small" aria-label="Crawl">🐛</button>
      <button id="attack" class="round" aria-label="Attack">⚔️</button>
      <button id="jump" class="round">⬆️</button>

      <div id="chat" hidden>
        <div id="chat-head"><span id="chat-who"></span><button id="chat-close" aria-label="Close">✖</button></div>
        <div id="chat-text"></div>
        <div id="chat-row">
          <button id="chat-mic" aria-label="Speak">🎤</button>
          <input id="chat-input" maxlength="200" autocomplete="off" />
          <button id="chat-send" aria-label="Send">➤</button>
        </div>
      </div>

      <div id="parent" hidden>
        <h2>Grown-ups</h2>
        <label>AI helper address<input id="ai-url" placeholder="https://oliverblox-ai.your-name.workers.dev" /></label>
        <label>Family code<input id="ai-code" type="password" /></label>
        <label>Voice
          <span id="voice-row"><select id="voice"></select><button id="voice-test" type="button">Test</button></span>
        </label>
        <div id="parent-toggles">
          <label><input id="set-music" type="checkbox" /> Music</label>
          <label><input id="set-fighting" type="checkbox" /> Skeletons and fighting</label>
          <label>Minutes a day (0 = no limit) <input id="set-limit" type="number" min="0" max="600" step="5" /></label>
          <span id="played"></span>
        </div>
        <label>What has been said<textarea id="ai-log" readonly rows="6"></textarea></label>
        <div id="parent-row">
          <button id="parent-save">Save</button>
          <button id="parent-close">Close</button>
          <button id="parent-erase">Erase world</button>
        </div>
      </div>
    </div>

    <div id="fade"></div>
    <div id="break" hidden>😴<span>Time for a break!</span></div>

    <div id="start">
      <h1><img src="/icon.svg" alt="" />OliverBlox</h1>
      <div id="picker" hidden>
        <button id="prev" aria-label="Previous hero">◀</button>
        <button id="next" aria-label="Next hero">▶</button>
      </div>
      <div id="start-bottom">
        <input id="player-name" maxlength="12" placeholder="Your name" autocomplete="off" aria-label="Your name" />
        <button id="play" aria-label="Play" hidden>▶</button>
      </div>
      <div id="loading"><div id="loading-bar"></div></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
