name = "oliverblox-ai"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Web addresses allowed to use this helper: the live game, plus the local test addresses.
ALLOWED_ORIGINS = "https://brandonrussell.io,http://localhost:5173,http://localhost:4173"

# Two secrets are set separately so they never appear in this file or on GitHub:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put FAMILY_CODE

# Speech for tablets that have no voice of their own. Uses the free daily allowance of Workers AI.
[ai]
binding = "AI"

# The relay for playing together. It runs on the free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Backups of each player's save.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]
